[project]
name = "scrna-agent"
version = "0.1.0"
description = "Single-cell RNA-seq analysis pipeline CLI tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BioAnalysis Team"}
]
keywords = [
    "single-cell",
    "RNA-seq",
    "scRNA-seq",
    "bioinformatics",
    "scanpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "umap-learn>=0.5.0",
    "leidenalg>=0.9.0",
    "python-igraph>=0.10.0",
    "pyyaml>=6.0",
    "louvain>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
full = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "scvi-tools>=1.0.0",
    "celltypist>=1.3.0",
    "harmonypy>=0.0.9",
    "biopython>=1.80",
    "python-dotenv>=1.0.0",
]

[project.scripts]
scrna-agent = "scrna_agent.cli_mvp:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scrna_agent", "scrna_agent.agents", "scrna_agent.tools"]
package-dir = {"scrna_agent" = "."}

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
